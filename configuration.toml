name = "Lab4 Project"
id = "lab4"

[directories]
constraints = ["src/constraints/"]
sources = ["sim/", "src/modules/"]
vvp = "build/vvp/"
vcd = "build/vcd/"
synthesis = "build/synth/"
implementation = "build/impl/"
bitstream = "build/bits/"

[[simulation]]
id = "bin2bcd"
top-symbol = "tb_Bin2Bcd"
